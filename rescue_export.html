<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みん会TCG 旧データ救出（読み取り専用）</title><style>body{font-family:system-ui,sans-serif;max-width:780px;margin:35px auto;padding:0 18px;background:#101a28;color:#eef4ff;line-height:1.7}button{font-size:1.1rem;padding:13px 22px;border:0;border-radius:9px;background:#80d5ff;color:#081522;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e3045;padding:16px;border-radius:8px}strong{color:#ffd78b}</style></head><body><h1>みん会TCG 旧データ救出</h1><p><strong>SIM本体を起動せずに</strong>、このブラウザに残る保存データをJSONとしてダウンロードします。保存領域への書き込み、削除、カード移行、クラウド通信は行いません。</p><p><strong>重要：</strong>このページは、以前SIMを使っていた<strong>同じブラウザ・同じ端末</strong>で、GitHub PagesのSIMと<strong>同じドメイン</strong>から開いてください。<code>file://</code>や別サイトでは保存データを読めません。</p><button id="export">保存データを救出してJSONを保存</button><pre id="status" aria-live="polite">待機中。SIM本体は開かないでください。</pre><p>ダウンロードしたJSONにはカードやデッキのほか、設定・セッション情報などが含まれる可能性があります。第三者に共有せず、大切に保管してください。</p><script>\n'use strict';\nconst status=document.getElementById('status');\nfunction log(s){status.textContent += '\\n'+s;}\nfunction readStore(db,storeName){return new Promise(resolve=>{const items=[];try{const tx=db.transaction(storeName,'readonly');const req=tx.objectStore(storeName).openCursor();req.onsuccess=()=>{const cur=req.result;if(!cur)return resolve({items});try{items.push({key:cur.key,value:cur.value})}catch(e){items.push({key:String(cur.key),error:String(e)})}cur.continue()};req.onerror=()=>resolve({items,error:String(req.error)})}catch(e){resolve({items,error:String(e)})}})}\nfunction openExisting(name){return new Promise(resolve=>{let req,created=false;try{req=indexedDB.open(name);req.onupgradeneeded=e=>{created=true;try{e.target.transaction.abort()}catch(_){}};req.onerror=()=>resolve({name,error:created?'未登録のため開かずに終了':String(req.error)});req.onsuccess=()=>resolve({name,db:req.result})}catch(e){resolve({name,error:String(e)})}})}\nasync function collect(){const result={format:'minkai-readonly-rescue',version:1,exportedAt:new Date().toISOString(),origin:location.origin,localStorage:{},indexedDB:{},errors:[]};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);try{result.localStorage[k]=localStorage.getItem(k)}catch(e){result.errors.push('localStorage '+k+': '+e)}}log('localStorage: '+Object.keys(result.localStorage).length+'件');if(!indexedDB.databases){result.errors.push('このブラウザはIndexedDBデータベース一覧取得に非対応です。localStorageは保存されます。');return result}let names=[];try{names=(await indexedDB.databases()).map(x=>x.name).filter(Boolean)}catch(e){result.errors.push('IndexedDB一覧: '+e);return result}for(const name of names){const opened=await openExisting(name);if(!opened.db){result.indexedDB[name]={error:opened.error};continue}const db=opened.db;const stores={};for(const store of Array.from(db.objectStoreNames)){stores[store]=await readStore(db,store)}result.indexedDB[name]={version:db.version,stores};db.close();log('IndexedDB: '+name+' ('+Object.keys(stores).length+'ストア)')}return result}\ndocument.getElementById('export').onclick=async()=>{const btn=document.getElementById('export');btn.disabled=true;status.textContent='読み取り開始';try{const data=await collect();const json=JSON.stringify(data);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MinKaiTCG_READONLY_RESCUE_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);log('保存ファイル作成完了: '+(blob.size/1024/1024).toFixed(2)+' MiB');if(data.errors.length)log('注意: '+data.errors.join('; '));else log('読み取りエラーなし。ダウンロードフォルダを確認してください。')}catch(e){log('エラー: '+e)}finally{btn.disabled=false}};\n</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みん会TCG 復旧ツール</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#eaf2ff;max-width:900px;margin:30px auto;padding:0 16px;line-height:1.65}section{background:#1b2a3d;padding:18px;border-radius:12px;margin:14px 0}button,input{font:inherit}button{background:#80d4ff;color:#0a1824;border:0;border-radius:8px;padding:10px 17px;cursor:pointer;margin:4px}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1420;padding:12px;border-radius:7px;max-height:330px;overflow:auto}.warn{color:#ffcc82}label{display:block;margin:9px 0}h1{font-size:1.6rem}small{color:#b8c9dc}</style></head><body><h1>みん会TCG レスキューJSON復旧ツール</h1><p class="warn">SIM本体を起動せず、救出JSONを現在のブラウザの保存領域に復元します。クラウド同期・通信は行いません。復元前に現在の保存内容をJSONで退避してください。</p><section><h2>1. 救出JSONを選択</h2><p><small>必ずSIMと同じドメインの recovery.html を開いてください。作業中はSIMの他のタブを閉じてください。プライベートブラウズでは保存先が異なる場合があります。</small></p><input id="file" type="file" accept=".json,application/json"><pre id="preview">ファイル未選択</pre></section><section><h2>2. 復元対象</h2><label><input id="cards" type="checkbox" checked> カード（IndexedDB）</label><label><input id="decks" type="checkbox" checked> デッキ（localStorage）</label><label><input id="extras" type="checkbox"> その他の設定（認証・オンライン状態・セッション関連は除外）</label><label><input id="otherdb" type="checkbox"> その他のIndexedDBデータ（画像・フォント等、JSON化で失われたBlobは復元できません）</label><p><small>既存カードはIDで統合。デッキは同じIDの既存デッキが空の場合だけ修復。正常な既存デッキは上書きしません。</small></p><button id="backup">現在のデータを先にバックアップ</button><label><input id="confirmedBackup" type="checkbox"> 復元前バックアップをダウンロードし、保存できたことを確認しました</label><button id="restore" disabled>復旧を実行</button><button id="rollback" disabled>直前の状態へ戻す（このページ内）</button><pre id="log">待機中</pre></section><script>
'use strict';
const $=id=>document.getElementById(id), log=s=>$('log').textContent+='\n'+s;
const DECK_KEY='minkai_tcg_decks_v01', CATALOG='minkai_tcg_catalog_v486';
let source=null, undo=null, backupReady=false;
function refreshRestore(){ $('restore').disabled=!source||!originCheck(source)||!backupReady||!$('confirmedBackup').checked }
$('confirmedBackup').onchange=refreshRestore;
function download(data,name){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function id(x){return x&&typeof x==='object'&&typeof x.id==='string'?x.id:null}
function entriesCount(d){const e=d&&d.entries;if(Array.isArray(e))return e.length;if(e&&typeof e==='object')return Object.values(e).reduce((n,v)=>n+(Number(v)||0),0);return 0}
function parsed(s,fallback){try{return JSON.parse(s)}catch(_){return fallback}}
function validDecks(a){return Array.isArray(a)&&a.every(d=>d&&typeof d==='object'&&id(d)&&d.entries&&typeof d.entries==='object')}
function storeItems(d,n){return d?.indexedDB?.[CATALOG]?.stores?.[n]?.items||[]}
function getCards(d){const v=storeItems(d,'catalog').find(x=>x.key==='cards')?.value;return Array.isArray(v)?v:[]}
function getDecks(d){return parsed(d?.localStorage?.[DECK_KEY],[])}
function originCheck(d){return d.origin===location.origin&&/^https?:$/.test(location.protocol)}
function inspect(d){const cards=getCards(d),decks=getDecks(d),cids=new Set(cards.map(id)),refs=new Set();for(const deck of decks){for(const k of Object.keys(deck.entries||{}))refs.add(k)}const missing=[...refs].filter(x=>!cids.has(x));return {format:d.format,origin:d.origin,cards:cards.length,decks:decks.length,nonemptyDecks:decks.filter(x=>entriesCount(x)>0).length,emptyDecks:decks.filter(x=>entriesCount(x)===0).length,missingCardIds:missing.length,examples:missing.slice(0,8),databases:Object.keys(d.indexedDB||{}),notes:'JSONで空オブジェクトになった画像・フォントBlobは再現不可'}}
function openDB(name,stores,version){return new Promise((resolve,reject)=>{let r;try{r=version?indexedDB.open(name,version):indexedDB.open(name)}catch(e){reject(e);return}r.onupgradeneeded=()=>{for(const s of stores)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('データベースが他のタブで使用中: '+name))})}
function readAll(db,s){return new Promise((resolve,reject)=>{const a=[];const t=db.transaction(s,'readonly'),r=t.objectStore(s).openCursor();r.onsuccess=()=>{const c=r.result;if(c){a.push({key:c.key,value:c.value});c.continue()}else resolve(a)};r.onerror=()=>reject(r.error)})}
function put(db,s,k,v){return new Promise((resolve,reject)=>{const t=db.transaction(s,'readwrite'),store=t.objectStore(s);try{if(store.keyPath!==null){if(typeof store.keyPath==='string'&&v&&typeof v==='object'&&v[store.keyPath]===undefined)v={...v,[store.keyPath]:k};store.put(v)}else store.put(v,k)}catch(e){reject(e);return}t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function isLostBinary(v){if(!v||typeof v!=='object')return false;if(Array.isArray(v))return v.some(isLostBinary);return Object.entries(v).some(([k,x])=>/^(blob|fullBlob|thumbBlob|imageBlob|fontBlob|fileBlob)$/i.test(k)&&x&&typeof x==='object'&&!Array.isArray(x)&&Object.keys(x).length===0||isLostBinary(x))}
async function capture(){const d={format:'minkai-restore-rollback',origin:location.origin,exportedAt:new Date().toISOString(),localStorage:{},indexedDB:{},errors:[]};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d.localStorage[k]=localStorage.getItem(k)}let names=[];if(indexedDB.databases){names=(await indexedDB.databases()).map(x=>x.name).filter(Boolean)}else names=[CATALOG];if(!names.includes(CATALOG))names.push(CATALOG);for(const name of names){let db;try{db=await openDB(name,[]);const stores={};for(const s of db.objectStoreNames)stores[s]={items:await readAll(db,s)};d.indexedDB[name]={version:db.version,stores}}catch(e){d.errors.push(name+': '+e)}finally{db?.close()}}return d}
async function saveCards(cards){const db=await openDB(CATALOG,['catalog']);try{let old=[];try{old=(await readAll(db,'catalog')).find(x=>x.key==='cards')?.value||[]}catch(_){}if(!Array.isArray(old))throw Error('現在のカード領域が不正');const map=new Map(old.filter(id).map(c=>[c.id,c]));let added=0;for(const c of cards){if(!id(c)||isLostBinary(c))continue;if(!map.has(c.id)){map.set(c.id,c);added++}}await put(db,'catalog','cards',[...map.values()]);return {added,total:map.size}}finally{db.close()}}
function saveDecks(decks){const existing=parsed(localStorage.getItem(DECK_KEY),[]);if(!Array.isArray(existing))throw Error('既存デッキが不正');const map=new Map(existing.filter(id).map(d=>[d.id,d]));let added=0,repaired=0,kept=0;for(const d of decks){const old=map.get(d.id);if(!old){map.set(d.id,d);added++}else if(entriesCount(old)===0&&entriesCount(d)>0){map.set(d.id,{...old,entries:d.entries});repaired++}else kept++}localStorage.setItem(DECK_KEY,JSON.stringify([...map.values()]));return {added,repaired,kept,total:map.size}}
function excluded(k){return /auth|session|token|secret|password|credential|online|private|owner|management.key|supabase/i.test(k)}
async function saveOtherDB(data){let written=0,skipped=0;for(const [name,info] of Object.entries(data.indexedDB||{})){if(name===CATALOG||!info.stores)continue;const names=Object.keys(info.stores);const db=await openDB(name,names);try{for(const s of names){let oldKeys=new Set((await readAll(db,s)).map(x=>JSON.stringify(x.key)));for(const item of info.stores[s].items||[]){if(oldKeys.has(JSON.stringify(item.key))){skipped++;continue}if(isLostBinary(item.value)){skipped++;continue}await put(db,s,item.key,item.value);written++}}}finally{db.close()}}return {written,skipped}}
$('file').onchange=async()=>{source=null;backupReady=false;$('confirmedBackup').checked=false;refreshRestore();try{const f=$('file').files[0];if(!f)return;const d=JSON.parse(await f.text());if(!d||!d.localStorage||!d.indexedDB||!['minkai-readonly-rescue','minkai-restore-rollback'].includes(d.format))throw Error('対応していないJSON形式');if(!validDecks(getDecks(d)))throw Error('デッキ形式が不正');source=d;const x=inspect(d);$('preview').textContent=JSON.stringify(x,null,2);if(!originCheck(d)){$('preview').textContent+='\n\n注意: 元データのドメインが異なります。復旧不可。'}else refreshRestore()}catch(e){$('preview').textContent='読み込み失敗: '+e}};
$('backup').onclick=async()=>{try{$('log').textContent='現在のデータを読み取り中';const d=await capture();if(d.errors.length)throw Error('バックアップの読み取りに失敗: '+d.errors.join('; '));download(d,'MinKaiTCG_BEFORE_RESTORE_'+Date.now()+'.json');backupReady=true;refreshRestore();log('バックアップのダウンロードを開始しました。ファイルの保存を確認し、チェックを入れてください。'+(d.errors.length?' 注意: '+d.errors.join('; '):''))}catch(e){log('バックアップ失敗: '+e)}};
$('restore').onclick=async()=>{if(!source||!originCheck(source)||!backupReady||!$('confirmedBackup').checked)return;const cards=getCards(source),decks=getDecks(source);if(!$('cards').checked&&!$('decks').checked&&!$('extras').checked&&!$('otherdb').checked)return;if(!confirm('復元を実行します。現在の保存データのバックアップを必ず確保してください。続けますか？'))return;$('restore').disabled=true;$('log').textContent='復元前の状態を記録中';try{undo=await capture();download(undo,'MinKaiTCG_AUTO_ROLLBACK_'+Date.now()+'.json');if(undo.errors.length)throw Error('事前バックアップにエラー: '+undo.errors.join('; '));log('自動バックアップを作成');if($('cards').checked){const r=await saveCards(cards);log('カード: '+JSON.stringify(r))}if($('decks').checked){const r=saveDecks(decks);log('デッキ: '+JSON.stringify(r))}if($('extras').checked){let n=0;for(const [k,v] of Object.entries(source.localStorage)){if(k===DECK_KEY||excluded(k)||localStorage.getItem(k)!==null)continue;localStorage.setItem(k,v);n++}log('その他の設定: '+n+'件を追加')}if($('otherdb').checked)log('その他のDB: '+JSON.stringify(await saveOtherDB(source)));log('復元処理完了。SIMの起動は復元データを別途保全してから行ってください。');$('rollback').disabled=false}catch(e){log('復元エラー: '+e+'。途中まで書き込まれた可能性があります。直前の状態へ戻すを利用してください。');$('rollback').disabled=!undo}finally{refreshRestore()}};
$('rollback').onclick=async()=>{if(!undo||!confirm('復元前の状態へ戻します。続行しますか？'))return;try{const currentKeys=[];for(let i=0;i<localStorage.length;i++)currentKeys.push(localStorage.key(i));for(const k of currentKeys)if(!(k in undo.localStorage))localStorage.removeItem(k);for(const [k,v] of Object.entries(undo.localStorage))localStorage.setItem(k,v);for(const [name,info] of Object.entries(undo.indexedDB)){const db=await openDB(name,Object.keys(info.stores||{}));try{for(const [s,data] of Object.entries(info.stores||{})){await new Promise((resolve,reject)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=resolve;t.onerror=()=>reject(t.error)});for(const item of data.items||[])await put(db,s,item.key,item.value)}}finally{db.close()}}log('直前の状態に復元しました。注意：バックアップ時に存在しなかったDBやストアは削除していません。')}catch(e){log('巻き戻し失敗: '+e)}};
</script></body></html>
